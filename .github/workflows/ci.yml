name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Visual baselines are intentionally captured on Windows. Keep the runner
    # platform aligned because Chromium text rasterization is platform-specific.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore pinned component sources
        run: pnpm upstream:restore

      - name: Verify component source locks and adapters
        run: pnpm upstream:check

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @exre/exui-docs exec playwright install chromium

      - name: Validate tokens
        run: pnpm tokens:check

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Lint workspaces
        run: pnpm lint

      - name: Build workspaces
        run: pnpm build

      - name: Test docs content and static contracts
        run: pnpm test:docs-content

      - name: Test ExUI capability coverage
        run: pnpm test:docs-capabilities

      - name: Check ExUI capability coverage
        run: pnpm docs:capabilities:check

      - name: Verify docs public snippets
        run: pnpm docs:snippets:verify

      - name: Verify docs static production output
        run: pnpm docs:static:verify

      - name: Test docs example sharing
        run: pnpm test:docs-sharing

      - name: Verify docs example sharing
        run: pnpm docs:sharing:verify

      - name: Test component source restoration and contracts
        run: pnpm test:upstream

      - name: Test chart style and tooling regressions
        run: pnpm test:regressions

      - name: Test ExUI Skill reference synchronization
        run: node --test scripts/exui-skill/sync-references.test.mjs

      - name: Check ExUI Skill references and inventories
        run: |
          node scripts/exui-skill/sync-references.mjs --check
          node scripts/exui-skill/update-inventories.mjs --check
          node scripts/exui-skill/verify.mjs

      - name: Verify Skill examples
        run: node scripts/exui-skill/verify-examples.mjs

      - name: Run visual tests
        run: pnpm test:visual

      - name: Verify packed consumers
        run: pnpm verify:pack

      - name: Verify release configuration
        run: pnpm release:verify

      - name: Test release automation
        run: pnpm test:release

      - name: Test docs Pages guards
        run: node --test scripts/docs-pages.test.mjs

      - name: Build docs under a deployment prefix
        env:
          EXUI_DOCS_BASE: /exui/
        run: pnpm --filter @exre/exui-docs build

      - name: Verify docs static output under a deployment prefix
        run: pnpm docs:static:verify packages/docs/build/client /exui/

      - name: Verify docs sharing under a deployment prefix
        run: pnpm docs:sharing:verify packages/docs/build/client /exui/

      - name: Save verified docs for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/docs/build/client
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          archive: true
          overwrite: false

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
